<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield / Square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- Subtle Inner Grid / Matrix Accent -->
  <path d="M12 20h40M12 32h40M12 44h40" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Technical Slash "//" -->
  <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8" filter="url(#glow)">//</text>

  <!-- Monogram "KB" -->
  <text x="31" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-0.5">KB</text>

  <!-- Corner Pulse Dot -->
  <circle cx="50" cy="14" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
